<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AP Physics Farm – Study Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Georgia', serif;
      background: #2d5a27;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    #gameCanvas {
      display: block;
      flex-shrink: 0;
    }

    /* ─── Question Panel ─── */
    #questionPanel {
      background: linear-gradient(135deg, #fdf6e3 0%, #f5e6c8 100%);
      border-top: 3px solid #c8a96e;
      padding: 10px 16px 8px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      overflow: hidden;
    }

    .phase-bar-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .phase-label {
      font-size: 0.82em;
      font-weight: bold;
      color: #7a5c2e;
      white-space: nowrap;
      background: rgba(200,169,110,0.3);
      padding: 2px 8px;
      border-radius: 10px;
    }

    .progress-wrap {
      flex: 1;
      height: 10px;
      background: rgba(0,0,0,0.12);
      border-radius: 5px;
      overflow: hidden;
      min-width: 60px;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #6acd6a, #3a9e3a);
      border-radius: 5px;
      transition: width 0.5s ease;
    }

    .progress-text {
      font-size: 0.78em;
      color: #7a5c2e;
      white-space: nowrap;
    }

    .question-text {
      font-size: 1.0em;
      font-weight: bold;
      color: #3c2a10;
      line-height: 1.35;
      text-align: center;
    }

    /* ─── Multiple Choice ─── */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .option-btn {
      background: linear-gradient(135deg, #fff9f0, #fef0d5);
      border: 2px solid #c8a96e;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 0.88em;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
      color: #3c2a10;
      line-height: 1.3;
      font-family: 'Georgia', serif;
    }

    .option-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, #ffefc9, #ffe0a0);
      border-color: #a07840;
      transform: translateY(-1px);
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .option-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .option-btn.correct {
      background: linear-gradient(135deg, #c8f5c8, #98e898) !important;
      border-color: #3a8a3a !important;
      color: #1a5a1a !important;
    }

    .option-btn.wrong {
      background: linear-gradient(135deg, #ffc8c8, #f58888) !important;
      border-color: #cc3333 !important;
      color: #7a1010 !important;
    }

    .option-btn:disabled {
      cursor: default;
    }

    /* ─── True / False ─── */
    .tf-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .tf-btn {
      text-align: center !important;
      font-size: 1.0em !important;
      font-weight: bold;
      padding: 10px !important;
      letter-spacing: 0.03em;
    }

    /* ─── Short Answer ─── */
    .short-answer-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .short-answer-input {
      flex: 1;
      padding: 8px 12px;
      font-size: 1.0em;
      font-family: 'Georgia', serif;
      border: 2px solid #c8a96e;
      border-radius: 8px;
      background: linear-gradient(135deg, #fff9f0, #fef0d5);
      color: #3c2a10;
      outline: none;
      transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
      min-width: 0;
    }

    .short-answer-input::placeholder {
      color: #b09060;
      font-style: italic;
    }

    .short-answer-input:focus {
      border-color: #a07840;
      box-shadow: 0 0 0 2px rgba(160,120,64,0.25);
    }

    .short-answer-input.input-correct {
      background: linear-gradient(135deg, #c8f5c8, #98e898) !important;
      border-color: #3a8a3a !important;
      color: #1a5a1a !important;
      box-shadow: none !important;
    }

    .short-answer-input.input-wrong {
      background: linear-gradient(135deg, #ffc8c8, #f58888) !important;
      border-color: #cc3333 !important;
      color: #7a1010 !important;
      box-shadow: none !important;
    }

    .unit-label {
      font-size: 0.92em;
      font-weight: bold;
      color: #7a5c2e;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .submit-btn {
      text-align: center !important;
      white-space: nowrap;
      flex-shrink: 0;
      padding: 8px 16px !important;
    }

    .explanation-text {
      font-size: 0.8em;
      font-style: italic;
      text-align: center;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(200,169,110,0.18);
      line-height: 1.3;
    }

    /* ─── Shake animation (invalid short-answer input) ─── */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%       { transform: translateX(-6px); }
      40%       { transform: translateX(6px); }
      60%       { transform: translateX(-4px); }
      80%       { transform: translateX(4px); }
    }

    .shake {
      animation: shake 0.4s ease;
    }

    /* ─── Overlay ─── */
    #overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.55);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .overlay-box {
      background: linear-gradient(135deg, #fdf6e3, #f5e6c8);
      border: 3px solid #c8a96e;
      border-radius: 20px;
      padding: 35px 45px;
      text-align: center;
      max-width: 400px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }

    .overlay-box h2 {
      font-size: 2.2em;
      color: #3c2a10;
      margin-bottom: 12px;
    }

    .overlay-box p {
      font-size: 1.05em;
      color: #5a3e1e;
      margin-bottom: 8px;
    }

    .win-box h2 {
      color: #1a6e1a;
    }

    .phase-transition {
      background: linear-gradient(135deg, #e8f5e8, #c8f0c8);
      border-color: #3a8a3a;
    }

    .phase-transition h2 {
      color: #1a5a1a;
      font-size: 1.8em;
    }

    .restart-btn {
      margin-top: 18px;
      background: linear-gradient(135deg, #6acd6a, #3a9e3a);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 12px 28px;
      font-size: 1.1em;
      cursor: pointer;
      font-family: 'Georgia', serif;
      font-weight: bold;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .restart-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.25);
    }

    .restart-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  <div id="questionPanel">
    <div class="question-text">Loading...</div>
  </div>
  <div id="overlay"></div>

  <script src="questions.js"></script>
  <script src="game.js"></script>
</body>
</html>
